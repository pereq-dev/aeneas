# The Lean project around the extraction is
# `proofs/hax-tests/lean/lakefile.toml`, which builds against the Lean library
# of this checkout: hax must not generate one of its own.
project-files = false

# Points `cargo hax` at the aeneas and charon of this checkout (built with
# `make build-dev` and `make setup-charon`) instead of the versions hax pins.
[tools]
aeneas = { path = "../../bin/aeneas" }
charon = { path = "../../charon/bin/charon" }

# Run by `scripts/test-hax.sh`, with `cargo hax extract`. The scenario name
# gives the Lean package name, `HaxTests`, and the output directory,
# `proofs/hax-tests/lean`.
[scenario.hax-tests]
backend = "lean"
# `-extra-includes` adds its imports to every generated file: the stubs of the
# core `Lawful` structures the generated specs refer to, until the CoreModels
# library provides them, and the hand-written models of
# `HaxTests.Assumptions.ExternalModels`. `-external-names` maps the opaque
# functions of `external-names.json` to these models; the path is resolved
# against the directory aeneas runs in, `tests/hax` (where `cargo hax extract`
# runs).
aeneas-args = [
  "-extra-includes",
  "HaxTests.Assumptions.MissingCore,HaxTests.Assumptions.ExternalModels",
  "-external-names", "external-names.json",
]
